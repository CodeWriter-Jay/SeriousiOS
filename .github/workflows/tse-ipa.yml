name: Build TSE IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FLEX_BIN: /opt/homebrew/opt/flex/bin/flex
      BISON_BIN: /opt/homebrew/opt/bison/bin/bison
    steps:
      - name: Checkout SeriousiOS
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare pinned upstream and build tools
        shell: bash
        run: |
          set -euo pipefail
          cat Dependencies.lock >> "$GITHUB_ENV"
          source Dependencies.lock
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install bison flex
          git clone --filter=blob:none "$SERIOUSSAMCLASSIC_REPOSITORY" upstream/SeriousSamClassic
          git -C upstream/SeriousSamClassic checkout --detach "$SERIOUSSAMCLASSIC_COMMIT"
          test "$(git -C upstream/SeriousSamClassic rev-parse HEAD)" = "$SERIOUSSAMCLASSIC_COMMIT"

      - name: Generate engine sources and TSE registries
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_host_tools.sh upstream/SeriousSamClassic build/host-tools
          bash scripts/generate_all_sources.sh upstream/SeriousSamClassic build/host-tools build/generated-all
          mkdir -p build/static-registries
          python3 scripts/generate_static_entity_registry.py \
            build/generated-all/TSE TSE \
            build/static-registries/SeriousIOSTSEEntityRegistry.cpp \
            --upstream upstream/SeriousSamClassic \
            --manifest build/static-registries/TSE-entities.json
          python3 scripts/generate_static_runtime_registry.py \
            upstream/SeriousSamClassic TSE \
            build/static-registries/SeriousIOSTSERuntimeRegistry.cpp \
            --manifest build/static-registries/TSE-runtime.json

      - name: Apply the existing iOS port
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/apply_upstream_patches.sh upstream/SeriousSamClassic
          python3 scripts/transform_sources_for_ios.py upstream/SeriousSamClassic
          python3 scripts/transform_cmake_for_ios.py upstream/SeriousSamClassic
          python3 scripts/inject_ios_platform_sources.py upstream/SeriousSamClassic
          git -C upstream/SeriousSamClassic diff --check

      - name: Configure and compile TSE for iPhone
        shell: bash
        run: |
          set -euo pipefail
          repository_root=$(pwd)
          cmake \
            -S upstream/SeriousSamClassic/SamTSE/Sources \
            -B build/cmake-model/TSE \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DUSE_SYSTEM_SDL2=OFF \
            -DUSE_SYSTEM_ZLIB=OFF \
            -DUSE_ASM=OFF \
            -DECC="$repository_root/build/host-tools/TSE/bin/ecc-se" \
            -DSERIOUSIOS_RUNTIME_ONLY=ON \
            -DSERIOUSIOS_PLATFORM_ROOT="$repository_root/Sources/Platform/iOS"
          bash scripts/build_ios_runtime_archives.sh build/cmake-model/TSE TSE build/archive-evidence

      - name: Link and package the TSE IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_ios_uikit_host.sh \
            build/cmake-model/TSE TSE \
            build/static-registries/SeriousIOSTSEEntityRegistry.cpp \
            build/static-registries/SeriousIOSTSERuntimeRegistry.cpp \
            build/uikit-evidence
          executable=build/uikit-evidence/SeriousIOS-TSE.app/SeriousIOS-TSE
          nm -g "$executable" > build/uikit-evidence/TSE-symbols.txt
          grep -Fq '_SeriousIOS_TSE_RegisterEntitySymbols' build/uikit-evidence/TSE-symbols.txt
          grep -Fq '_CChainsawFreak_DLLClass' build/uikit-evidence/TSE-symbols.txt
          grep -Fq '_CSeriousBomb_DLLClass' build/uikit-evidence/TSE-symbols.txt

      - name: Upload TSE IPA
        uses: actions/upload-artifact@v4
        with:
          name: SeriousIOS-TSE-unsigned
          path: |
            build/uikit-evidence/SeriousIOS-TSE-unsigned.ipa
            build/uikit-evidence/TSE-ipa.sha256
            build/uikit-evidence/TSE-ipa-manifest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TSE-build-diagnostics
          path: |
            build/host-tools/host-tools-build.log
            build/generated-all/full-generation-manifest.txt
            build/static-registries
            build/archive-evidence/*.log
            build/uikit-evidence/*.log
            build/uikit-evidence/TSE-symbols.txt
          if-no-files-found: warn
          retention-days: 7
